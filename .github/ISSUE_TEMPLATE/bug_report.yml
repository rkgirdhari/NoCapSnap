name: Bug report
description: Something in the CapSnap app, server or guest page doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't include guest feedback, staff passwords, guest links or other private data.
        Security problems go to **Security → Report a vulnerability**, not here.
  - type: dropdown
    id: area
    attributes:
      label: Where
      options: [Staff app (Android), Guest feedback page, Server / API, Deploy kit, Other]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: The app's version from Settings, or `capsnap-server version`.
