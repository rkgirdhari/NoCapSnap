# Weekly dependency updates. Security updates come as soon as an advisory is published
# (enable "Dependabot security updates" in Settings → Code security).
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/server", "/crates/capsnap-store", "/crates/capsnap-sync", "/crates/capsnap-onboard", "/app/src-tauri"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      js-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
