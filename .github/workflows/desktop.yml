# CapSnap staff app for Windows: the same Tauri app as on Android, built on a Windows runner into
# installers (an .msi and a setup .exe). The owner brought this forward from Spec §7 Phase 7 (2026-10-01).
# Download them from the run's "capsnap-windows" artifact (30 days), or from a GitHub Release, which keeps them:
#   tag vX.Y.Z (= app version), or a manual run on main with "publish a release" ticked (Actions → Desktop →
#   Run workflow). The installers join the Android APK in release v<app version>; if that tag already exists, its
#   commit is built, so they match the APK (.github/scripts/publish-release.sh).
name: Desktop (Windows)

on:
  pull_request:
    paths:
      - "app/**"
      - "crates/capsnap-store/**"
      - "crates/capsnap-sync/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "crates/capsnap-store/**"
      - "crates/capsnap-sync/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish the installers to GitHub Release v<app version> (main only; creates it if missing)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never

jobs:
  windows:
    name: Windows installers
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
      release_sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Release source
        id: version
        shell: bash
        env:
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main' }}
        run: |
          # The same rule as android.yml: a tag push builds the tag (= app version); a manual release run builds
          # the existing tag's commit if there is one, else main.
          version() { node -p 'require("./app/src-tauri/tauri.conf.json").version'; }
          tag="v$(version)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the app version ${tag#v} (tauri.conf.json)"; exit 1
            fi
          elif [ "$RELEASE" = true ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            git fetch --quiet --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
            git checkout --quiet --detach "$tag"
            if [ "v$(version)" != "$tag" ]; then echo "::error::tag $tag holds app version $(version)"; exit 1; fi
            echo "Release $tag exists: building its commit $(git rev-parse --short HEAD)"
          fi
          { echo "tag=$tag"; echo "sha=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"
      - name: Toolchains
        run: |
          corepack enable
          pnpm --version
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: desktop-windows-${{ hashFiles('app/src-tauri/Cargo.lock') }}
      - name: Build (release, no browser preview)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build
      - name: Collect installers and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item app/src-tauri/target/release/bundle/msi/*.msi dist/
          Copy-Item app/src-tauri/target/release/bundle/nsis/*-setup.exe dist/
          $preview = Get-ChildItem app/build -Recurse -File | Select-String -Pattern "guests.preview.invalid" -SimpleMatch -List
          if ($preview) { throw "the browser preview bridge is in the release build: $($preview.Path)" }
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: capsnap-windows
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: windows
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v8
        with:
          name: capsnap-windows
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.windows.outputs.release_tag }}
          TARGET_SHA: ${{ needs.windows.outputs.release_sha }}
        run: |
          # Its own checksum file, so it doesn't replace the Android one in the release.
          mv dist/SHA256SUMS.txt dist/SHA256SUMS-windows.txt
          about="Unsigned installers: Windows SmartScreen warns; choose More info, then Run anyway. The setup .exe is the smaller download; the .msi suits managed PCs."
          .github/scripts/publish-release.sh Windows "$about" true dist
