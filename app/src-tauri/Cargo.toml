[package]
name = "capsnap-app"
version = "0.1.3"
description = "CapSnap staff app (Tauri shell for Android)"
authors = ["Hammurabi Coding Company LLC"]
edition = "2024"
rust-version = "1.94"
publish = false
license = "LicenseRef-HCC-Proprietary"

# Standalone: keep this out of the repo-root Cargo workspace.
[workspace]

[lib]
# Tauri ships the Rust core on Android as lib<name>.so.
name = "capsnap_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Release builds ship without a symbol table, whatever the toolchain's default: the first CI build of the APK kept
# about 6 MB of symbols that the earlier local builds did not have. Exported (dynamic) symbols stay, so Android can
# still load the library.
[profile.release]
strip = "symbols"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
capsnap-store = { path = "../../crates/capsnap-store" }
capsnap-sync = { path = "../../crates/capsnap-sync" }
