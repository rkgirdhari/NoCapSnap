# Dependency policy for CapSnap, checked in CI by cargo-deny (`cargo deny --manifest-path <crate>/Cargo.toml
# check --config deny.toml`). CapSnap is proprietary, so every dependency must allow use in closed-source software.

[graph]
all-features = false

[advisories]
# Known vulnerabilities fail the build. Unmaintained crates fail only when we depend on them directly.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Our own crates are proprietary and never published (publish = false).
private = { ignore = true }
confidence-threshold = 0.93
# Each crate is checked on its own, so not every allowed license appears in every tree.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Mozilla's root certificate list (webpki-roots).
    "CDLA-Permissive-2.0",
    # File-level copyleft (servo CSS/HTML parsers used by ONB-1). Fine for proprietary use as long as
    # those crates' own files are not modified; changes to them would have to be published.
    "MPL-2.0",
]

[bans]
# Tauri pulls in several versions of some crates; that is noise, not risk.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
